[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "W", "C", "Q", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = 3.10
ignore_missing_imports = true
files = ["app.py", "tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]
